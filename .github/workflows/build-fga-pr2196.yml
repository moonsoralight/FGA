name: Build FGA v3032 with PR2196

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: macos-26

    steps:
      - name: Checkout official FGA v3032
        uses: actions/checkout@v4
        with:
          repository: Fate-Grand-Automata/FGA
          ref: v3032
          fetch-depth: 0
          persist-credentials: false

      - name: Merge PR 2196 into v3032
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "FGA PR2196 Cloud Builder"
          git config user.email "actions@users.noreply.github.com"
          git fetch https://github.com/Fate-Grand-Automata/FGA.git \
            refs/pull/2196/head:pr2196
          git merge --no-ff --no-edit pr2196

      - name: Give the test app a distinct name
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/ci/res/values
          cat > app/src/ci/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">FGA PR2196</string>
          </resources>
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build CI APK
        shell: bash
        env:
          FGA_VERSION_CODE: ${{ github.run_number }}
          FGA_VERSION_NAME: 3032-pr2196-${{ github.run_number }}
        run: |
          set -euxo pipefail
          chmod +x gradlew
          ./gradlew assembleCi --scan --parallel --no-daemon

      - name: Prepare downloadable files
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/ci/app-ci.apk \
            dist/FGA-v3032-PR2196-parallel.apk

          shasum -a 256 dist/FGA-v3032-PR2196-parallel.apk \
            > dist/FGA-v3032-PR2196-parallel.apk.sha256

          {
            echo "Base release: FGA v3032"
            echo "Base commit: $(git rev-parse v3032)"
            echo "PR 2196 head: $(git rev-parse pr2196)"
            echo "Merged build commit: $(git rev-parse HEAD)"
            echo "Application ID: io.github.fate_grand_automata.debug"
            echo "Build type: ci"
            echo "Signing: FGA repository debug signing configuration"
          } > dist/BUILD_INFO.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FGA-v3032-PR2196-Android14
          path: dist/
          retention-days: 14
          if-no-files-found: error
